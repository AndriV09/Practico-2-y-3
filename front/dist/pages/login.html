<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - Biblioteca Virtual</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <main class="pagina-login py-5">
        <div class="container">
            <div class="card border-0 shadow-sm tarjeta-login">
                <div class="card-body p-4">
                    <h1 class="h3 titulo-seccion text-center mb-1">Biblioteca Virtual</h1>
                    <p class="text-center text-muted mb-4">Iniciar sesión</p>

                    <div id="alerta-login" class="alert alert-danger d-none" role="alert"></div>

                    <form id="form-login">
                        <div class="mb-3">
                            <label for="usuario" class="form-label">Usuario</label>
                            <input type="text" class="form-control" id="usuario" autocomplete="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" autocomplete="current-password" required>
                        </div>
                        <button type="submit" class="btn boton-personalizado-azul text-white fw-semibold w-100">Ingresar</button>
                    </form>

                    <p class="text-center mt-3 mb-0">
                        <a href="../../index.html">Volver al sitio</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/pages/login.js"></script>
</body>
</html>
